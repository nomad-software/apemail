# Builds the AppImage for Linux.
#
# It runs when a tag starting with v is pushed (git tag v1.0.0 && git push
# origin v1.0.0), and attaches the AppImage to a release of that name. It can
# also be run by hand from the Actions tab of the repository, in which case
# the AppImage is only kept as an artifact of the run to download.
name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  # To make the release.
  contents: write

env:
  # The Qt that is built with and put in the AppImage. It is Qt's own build,
  # as the bindings (qute) are made from the headers of Qt 6.12 and build
  # with nothing older, and the Qt of Ubuntu 24.04 is 6.4.
  QT_VERSION: "6.12.0"
  QT_ROOT: /opt/qt/6.12.0/gcc_64

jobs:
  appimage:
    # An AppImage runs on systems as new as the one it was built on, or
    # newer: this one has glibc 2.39, which rolling distributions, as
    # CachyOS, are always newer than. Qt's own build is made on an older
    # system still, so it does not ask for more.
    runs-on: ubuntu-24.04
    steps:
      # Besides the tools, these are the system libraries Qt's own build
      # uses, most of which go into the AppImage with it: those of its
      # platform plugins for X11 and Wayland, of the GTK theme, by which a
      # dark GNOME desktop is seen to be dark, and of Qt WebEngine, which
      # shows messages.
      - name: Install what building needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates file pipx \
            libgl-dev libegl1 libopengl0 libglib2.0-0t64 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libx11-xcb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libgtk-3-0t64 \
            libnss3 libnspr4 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libxshmfence1 libgbm1 libdrm2 libcups2t64

      - uses: actions/cache@v4
        id: qt
        with:
          path: /opt/qt
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64-webengine-waylandcompositor

      # Qt SVG, which draws the icons, comes with Qt itself. Qt WebEngine
      # does not, nor do the two modules it uses, nor the one that brings
      # what Wayland loads.
      - name: Install Qt
        if: steps.qt.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/qt
          sudo chown "$USER" /opt/qt
          pipx run aqtinstall install-qt linux desktop "$QT_VERSION" linux_gcc_64 --outputdir /opt/qt \
            --modules qtwebengine qtwebchannel qtpositioning qtwaylandcompositor

      # Where the compiler, the bundling tool and the program itself find
      # that Qt.
      - name: Use that Qt
        run: |
          echo "$QT_ROOT/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$QT_ROOT/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$QT_ROOT/lib" >> "$GITHUB_ENV"
          echo "QMAKE=$QT_ROOT/bin/qmake" >> "$GITHUB_ENV"
          # The linker is told where the libraries are outright as well, so
          # that it does not depend on what was compiled by an earlier run
          # remembering the place of another version.
          echo "CGO_LDFLAGS=-L$QT_ROOT/lib" >> "$GITHUB_ENV"
          # What the build is told about Qt, to read if it fails.
          PKG_CONFIG_PATH="$QT_ROOT/lib/pkgconfig" pkg-config --modversion --cflags --libs \
            Qt6Widgets Qt6Svg Qt6WebEngineWidgets

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # What is compiled is kept by the step below instead.
          cache: false

      # The Qt bindings take minutes to compile, so what is compiled is
      # kept from one run to the next. It is kept for one version of Qt, as
      # what was compiled for another names the place that one was in.
      - name: Say where compiled code is kept
        run: echo "GOCACHE=$HOME/go-build" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/go-build
          key: go-build-qt-${{ env.QT_VERSION }}-${{ hashFiles('go.sum') }}

      - name: Build the AppImage
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: packaging/appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ApeMail-AppImage
          path: "*.AppImage"
          if-no-files-found: error

      - name: Attach it to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.AppImage"
          generate_release_notes: true
